name: Publish RAILWORKS to itch.io

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "VERSION"
      - ".github/workflows/publish-itch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railworks-itch-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Upload HTML5 game with Butler
    runs-on: ubuntu-latest
    steps:
      - name: Check out RAILWORKS
        uses: actions/checkout@v4

      - name: Validate web build
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/styles.css
          test -s web/src/game.js
          test -s VERSION

      - name: Install itch.io Butler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --show-error --silent --location --retry 3 \
            "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default" \
            -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version

      - name: Publish to gregclarke/railworks:html5
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::error::Missing BUTLER_API_KEY repository secret."
            exit 1
          fi
          "$RUNNER_TEMP/butler/butler" push web gregclarke/railworks:html5 --userversion-file VERSION
